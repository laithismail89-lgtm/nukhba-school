<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادية النخبة المهنية الأهلية - بوابة ولي الأمر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0f766e;
            --secondary-color: #14b8a6;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --bg-color: #f0fdfa;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #ccfbf1;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            direction: rtl;
        }
        .container {
            max-width: 100%;
            width: 100%;
            margin: 10px auto;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(15, 118, 110, 0.08);
            box-sizing: border-box;
            border-top: 5px solid var(--primary-color);
        }
        @media (min-width: 768px) {
            .container {
                max-width: 700px;
                padding: 30px;
                margin: 20px auto;
                border-radius: 16px;
                box-shadow: 0 4px 12px rgba(15, 118, 110, 0.1);
            }
        }
        h2 {
            text-align: center;
            color: var(--primary-color);
            font-size: 20px;
            margin-bottom: 5px;
        }
        .welcome-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #166534;
            line-height: 1.5;
            font-size: 13px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            box-sizing: border-box;
            text-align: center;
        }
        input:focus {
            border-color: var(--secondary-color);
            outline: none;
        }
        .btn-group {
            display: flex;
            gap: 8px;
        }
        button {
            flex: 1;
            padding: 11px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: var(--secondary-color);
        }
        .btn-secondary {
            background-color: #64748b;
        }
        .btn-secondary:hover {
            background-color: #475569;
        }
        .result-section {
            margin-top: 20px;
            display: none;
        }
        .student-info {
            background: #fdf4ff;
            border: 1px solid #f5d0fe;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            line-height: 1.8;
            font-size: 13px;
        }
        
        .wavy-name {
            font-weight: 700;
            font-size: 16px;
            background: linear-gradient(45deg, #7c3aed, #db2777, #2563eb, #0d9488);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            animation: waveGlow 4s ease infinite;
        }
        @keyframes waveGlow {
            0% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(45deg); }
            100% { filter: hue-rotate(0deg); }
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: bold;
            color: #64748b;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }
        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
            background: none;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
            font-size: 12px;
            white-space: nowrap;
        }
        @media (min-width: 768px) {
            table {
                font-size: 14px;
            }
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 8px 6px;
            text-align: center;
        }

        #gradesTab th {
            background-color: #1d4ed8;
            color: white;
        }
        #gradesTab td {
            background-color: #eff6ff;
        }

        #attendanceTab th {
            background-color: #c2410c;
            color: white;
        }
        #attendanceTab td {
            background-color: #fff7ed;
        }

        .excellence-badge {
            background-color: #d1fae5;
            color: #065f46;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 13px;
            border: 1px solid #6ee7b7;
        }
        .alert-box {
            padding: 10px;
            border-radius: 8px;
            margin-top: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 13px;
        }
        .alert-1 { background-color: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .alert-2 { background-color: #ffedd5; color: #9a3412; border: 1px solid #fed7aa; }
        .alert-3 { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        
        .error-msg {
            color: var(--danger-color);
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>إعدادية النخبة المهنية الأهلية</h2>
    
    <div class="welcome-box">
        <strong>أهلاً بك عزيزي ولي الأمر في واجهة ولي الأمر</strong><br>
        هنا يمكنك الاطلاع على آخر درجات ابنك وغياباته فور توفرها.
    </div>
    
    <div class="form-group">
        <label for="studentCode">أدخل الكود الخاص بأبنك:</label>
        <input type="text" id="studentCode" placeholder="مثال: ST80841765" autocomplete="off">
    </div>
    
    <div class="btn-group">
        <button onclick="fetchStudentData(false)">عرض البيانات</button>
        <button onclick="clearSavedData()" class="btn-secondary">مسح الكود المحفوظ</button>
    </div>
    
    <div id="errorMsg" class="error-msg"></div>

    <div id="resultSection" class="result-section">
        <div class="student-info" id="studentProfile"></div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('grades')">الدرجات</button>
            <button class="tab-btn" onclick="switchTab('attendance')">الغيابات</button>
        </div>

        <!-- تبويب الدرجات -->
        <div id="gradesTab" class="tab-content active">
            <div id="excellenceContainer"></div>
            <div class="table-responsive">
                <table id="gradesTable">
                    <thead>
                        <tr>
                            <th>المادة</th>
                            <th>الفترة</th>
                            <th>الدرجة</th>
                            <th>التاريخ</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <!-- تبويب الغيابات -->
        <div id="attendanceTab" class="tab-content">
            <div class="table-responsive">
                <table id="attendanceTable">
                    <thead>
                        <tr>
                            <th>ت</th>
                            <th>التاريخ</th>
                            <th>الحالة</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div id="attendanceSummary" style="margin-top: 12px; font-weight: bold; text-align: center; font-size: 13px;"></div>
            <div id="attendanceAlert"></div>
        </div>
    </div>
</div>

<script>
function decodeBase64UTF8(base64Str) {
    try {
        const binString = atob(base64Str);
        const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
        return new TextDecoder().decode(bytes);
    } catch (e) {
        return decodeURIComponent(escape(atob(base64Str)));
    }
}

window.addEventListener('DOMContentLoaded', () => {
    const savedCode = localStorage.getItem('nukhba_student_code');
    if (savedCode) {
        document.getElementById('studentCode').value = savedCode;
        fetchStudentData(true);
    }
});

function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

    if (tabName === 'grades') {
        document.querySelector('.tabs button:nth-child(1)').classList.add('active');
        document.getElementById('gradesTab').classList.add('active');
    } else {
        document.querySelector('.tabs button:nth-child(2)').classList.add('active');
        document.getElementById('attendanceTab').classList.add('active');
    }
}

function clearSavedData() {
    localStorage.removeItem('nukhba_student_code');
    document.getElementById('studentCode').value = '';
    document.getElementById('resultSection').style.display = 'none';
    document.getElementById('errorMsg').innerText = "تم مسح الكود المحفوظ بنجاح.";
}

async function fetchStudentData(isAuto = false) {
    const code = document.getElementById('studentCode').value.trim();
    const errorMsg = document.getElementById('errorMsg');
    const resultSection = document.getElementById('resultSection');
    
    errorMsg.innerText = "";
    resultSection.style.display = "none";

    if (!code) {
        if (!isAuto) errorMsg.innerText = "الرجاء إدخال كود الطالب الخاص.";
        return;
    }

    try {
        const response = await fetch('students_data.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error("تعذر الاتصال بقاعدة بيانات المدرسة.");
        
        const data = await response.json();

        if (!data[code]) {
            if (!isAuto) errorMsg.innerText = "كود الطالب غير صحيح أو غير موجود في النظام.";
            return;
        }

        localStorage.setItem('nukhba_student_code', code);

        const encryptedPayload = data[code];
        const decryptedString = decodeBase64UTF8(encryptedPayload);
        const student = JSON.parse(decryptedString);

        let profileHtml = `
            <strong>اسم الطالب:</strong> <span class="wavy-name">${student.profile.name || 'غير محدد'}</span><br>
            <strong>المرحلة:</strong> ${student.profile.stage || ''} | <strong>القسم:</strong> ${student.profile.dept || ''} | <strong>الشعبة:</strong> ${student.profile.group || ''}<br>
            <strong>الرمز المدرسي:</strong> ${student.profile.schoolCode || ''} | <strong>كود الطالب:</strong> ${code}
        `;
        document.getElementById('studentProfile').innerHTML = profileHtml;

        // --- الدرجات ---
        const gradesTbody = document.querySelector('#gradesTable tbody');
        gradesTbody.innerHTML = "";
        let hasExcellence = false;

        if (student.grades && student.grades.length > 0) {
            student.grades.forEach(g => {
                let scoreVal = parseFloat(g.score) || 0;
                if (scoreVal >= 90) hasExcellence = true;
                
                gradesTbody.innerHTML += `<tr>
                    <td>${g.subject || '-'}</td>
                    <td>${g.period || '-'}</td>
                    <td><b>${g.score || '-'}</b></td>
                    <td>${g.date || '-'}</td>
                </tr>`;
            });
        } else {
            gradesTbody.innerHTML = `<tr><td colspan="4">لا توجد درجات مسجلة حالياً</td></tr>`;
        }

        const excellenceContainer = document.getElementById('excellenceContainer');
        if (hasExcellence) {
            excellenceContainer.innerHTML = `<div class="excellence-badge">🌟 نشكرك على تميز ابنك!</div>`;
        } else {
            excellenceContainer.innerHTML = "";
        }

        // --- الغيابات ---
        const attTbody = document.querySelector('#attendanceTable tbody');
        attTbody.innerHTML = "";
        let absenceCount = 0;

        if (student.attendance && student.attendance.length > 0) {
            student.attendance.forEach((a, index) => {
                absenceCount++;
                attTbody.innerHTML += `<tr>
                    <td>${index + 1}</td>
                    <td>${a.date || '-'}</td>
                    <td>${a.status || 'غائب'}</td>
                </tr>`;
            });
        } else {
            attTbody.innerHTML = `<tr><td colspan="3">سجل الحضور ممتاز، لا توجد غيابات مسجلة</td></tr>`;
        }

        document.getElementById('attendanceSummary').innerText = `مجموع أيام الغياب: ${absenceCount} يوم`;
        
        const alertBox = document.getElementById('attendanceAlert');
        alertBox.innerHTML = "";
        if (absenceCount > 21) {
            alertBox.innerHTML = `<div class="alert-box alert-3">⚠️ إنذار نهائي (تجاوز الغياب 21 يوماً)</div>`;
        } else if (absenceCount > 14) {
            alertBox.innerHTML = `<div class="alert-box alert-2">⚠️ إنذار ثاني واستدعاء ولي أمر (تجاوز الغياب 14 يوماً)</div>`;
        } else if (absenceCount > 7) {
            alertBox.innerHTML = `<div class="alert-box alert-1">⚠️ إنذار أولي (تجاوز الغياب 7 أيام)</div>`;
        }

        resultSection.style.display = "block";

    } catch (error) {
        console.error(error);
        if (!isAuto) errorMsg.innerText = "حدث خطأ أثناء استعلام البيانات. تأكد من اتصالك بالإنترنت.";
    }
}
</script>

</body>
</html>
