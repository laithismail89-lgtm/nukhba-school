 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادية النخبة المهنية الأهلية - بوابة استعلام الطلاب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 650px;
            margin: 30px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            box-sizing: border-box;
            text-align: center;
        }
        input:focus {
            border-color: var(--secondary-color);
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: var(--secondary-color);
        }
        .result-box {
            margin-top: 30px;
            display: none;
        }
        .student-info {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            line-height: 1.8;
            font-size: 15px;
        }
        h3 {
            font-size: 17px;
            color: var(--primary-color);
            margin-top: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: var(--primary-color);
            color: white;
        }
        .error-msg {
            color: #dc2626;
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>إعدادية النخبة المهنية الأهلية</h2>
    <div class="subtitle">بوابة استعلام نتائج الطلاب والغيابات الآمنة</div>
    
    <div class="form-group">
        <label for="studentCode">أدخل كود الطالب الخاص:</label>
        <input type="text" id="studentCode" placeholder="مثال: ST80841765" autocomplete="off">
    </div>
    
    <button onclick="fetchStudentData()">عرض النتيجة والبيانات</button>
    
    <div id="errorMsg" class="error-msg"></div>

    <div id="resultBox" class="result-box">
        <div class="student-info" id="studentProfile">
            <!-- معلومات الطالب الأساسية -->
        </div>

        <h3>الدرجات الامتحانية</h3>
        <div style="overflow-x: auto;">
            <table id="gradesTable">
                <thead>
                    <tr>
                        <th>المادة</th>
                        <th>الفترة</th>
                        <th>الشهر</th>
                        <th>الدرجة</th>
                        <th>المدرس</th>
                        <th>التاريخ</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <h3>سجل الحضور والغياب</h3>
        <div style="overflow-x: auto;">
            <table id="attendanceTable">
                <thead>
                    <tr>
                        <th>المادة</th>
                        <th>الحالة</th>
                        <th>المدرس</th>
                        <th>التاريخ</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
async function fetchStudentData() {
    const code = document.getElementById('studentCode').value.trim();
    const errorMsg = document.getElementById('errorMsg');
    const resultBox = document.getElementById('resultBox');
    
    errorMsg.innerText = "";
    resultBox.style.display = "none";

    if (!code) {
        errorMsg.innerText = "الرجاء إدخال كود الطالب الخاص بشكل صحيح.";
        return;
    }

    try {
        // جلب ملف الـ JSON المرفوع على جيت هب مع منع التخزين المؤقت (Cache)
        const response = await fetch('students_data.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error("تعذر الاتصال بقاعدة بيانات المدرسة.");
        
        const data = await response.json();

        if (!data[code]) {
            errorMsg.innerText = "كود الطالب غير صحيح أو غير موجود في النظام.";
            return;
        }

        // فك تشفير البيانات الخاصة بهذا الكود (Base64 Decode)
        const encryptedPayload = data[code];
        const decryptedString = atob(encryptedPayload);
        const student = JSON.parse(decryptedString);

        // تعبئة البيانات الشخصية
        let profileHtml = `
            <strong>اسم الطالب:</strong> ${student.profile.name || 'غير محدد'}<br>
            <strong>المرحلة:</strong> ${student.profile.stage || ''} | <strong>القسم:</strong> ${student.profile.dept || ''} | <strong>الشعبة:</strong> ${student.profile.group || ''}<br>
            <strong>الرمز المدرسي:</strong> ${student.profile.schoolCode || ''} | <strong>رقم القيد:</strong> ${student.profile.registerNo || ''}
        `;
        document.getElementById('studentProfile').innerHTML = profileHtml;

        // تعبئة جدول الدرجات
        const gradesTbody = document.querySelector('#gradesTable tbody');
        gradesTbody.innerHTML = "";
        if (student.grades && student.grades.length > 0) {
            student.grades.forEach(g => {
                gradesTbody.innerHTML += `<tr><td>${g.subject}</td><td>${g.period || '-'}</td><td>${g.month || '-'}</td><td><b>${g.score}</b></td><td>${g.teacher || '-'}</td><td>${g.date || '-'}</td></tr>`;
            });
        } else {
            gradesTbody.innerHTML = `<tr><td colspan="6">لا توجد درجات مسجلة حالياً</td></tr>`;
        }

        // تعبئة جدول الغيابات
        const attTbody = document.querySelector('#attendanceTable tbody');
        attTbody.innerHTML = "";
        if (student.attendance && student.attendance.length > 0) {
            student.attendance.forEach(a => {
                attTbody.innerHTML += `<tr><td>${a.subject || '-'}</td><td>${a.status}</td><td>${a.teacher || '-'}</td><td>${a.date || '-'}</td></tr>`;
            });
        } else {
            attTbody.innerHTML = `<tr><td colspan="4">سجل الحضور ممتاز، لا توجد غيابات مسجلة</td></tr>`;
        }

        resultBox.style.display = "block";

    } catch (error) {
        console.error(error);
        errorMsg.innerText = "حدث خطأ أثناء استعلام البيانات. تأكد من اتصالك بالإنترنت.";
    }
}
</script>

</body>
</html>
